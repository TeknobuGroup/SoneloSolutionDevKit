name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile repo_setup.py worklog_agent.py
      - run: python repo_setup.py --help > /dev/null && python worklog_agent.py --help > /dev/null
      - name: Install to a temporary home (neutral defaults, no CLIs, no logins)
        run: HOME=$RUNNER_TEMP/h python repo_setup.py install --yes --no-cli --no-login --no-presence
      - name: Apply to a scratch repo and check
        run: |
          mkdir -p $RUNNER_TEMP/r && cd $RUNNER_TEMP/r && git init -q -b main && git config user.name ci && git config user.email ci@example.com
          echo '{"name":"r","scripts":{"build":"echo build","test":"echo test"}}' > package.json && git add -A && git commit -qm "chore: init"
          HOME=$RUNNER_TEMP/h WORKLOG_NO_OPEN=1 python $RUNNER_TEMP/h/.claude/sonelo/repo_setup.py apply
          HOME=$RUNNER_TEMP/h python $RUNNER_TEMP/h/.claude/sonelo/repo_setup.py check
