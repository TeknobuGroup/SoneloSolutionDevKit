# sonelo-devkit pipeline - pull-request gates: changelog entry, UAT document, types regenerated after migrations.
name: CI gates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed files
        id: files
        run: |
          git diff --name-only "origin/${{ github.base_ref }}"...HEAD > changed.txt
          echo "code=$(grep -Ev '^(docs/|CHANGELOG\.md|\.claude/|\.github/|.*\.md$|\.env)' changed.txt | head -1)" >> "$GITHUB_OUTPUT"
      - name: Changelog entry present
        if: steps.files.outputs.code != ''
        run: grep -q '^CHANGELOG\.md$' changed.txt || { echo "::error::Code changed but CHANGELOG.md has no entry. Run /post-change."; exit 1; }
      - name: UAT document present
        if: steps.files.outputs.code != ''
        run: grep -q '^docs/uat/' changed.txt || { echo "::error::Code changed but no docs/uat/ document was added for this PR. Run /pr (uat-writer)."; exit 1; }
      - name: Types regenerated after migrations
        run: |
          if grep -q '^supabase/migrations/' changed.txt && ! grep -q '^src/types/database.ts$' changed.txt; then
            why=$(git log --format=%B "origin/${{ github.base_ref }}"..HEAD | grep -iE '^Types-not-affected:[[:space:]]*[^[:space:]]' | head -1)
            if [ -n "$why" ]; then
              echo "Types gate waived by the author: $why"
            else
              echo "::error::Migration changed but src/types/database.ts was not regenerated. If this migration cannot change types - a policy, grant or data-only migration produces no type diff - say so in a commit trailer, with a reason: Types-not-affected: policy-only migration"; exit 1
            fi
          fi
