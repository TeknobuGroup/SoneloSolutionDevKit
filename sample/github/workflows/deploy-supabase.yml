# teknobu-kit v1.0 - Supabase migrations and edge functions. prelive -> prelive project, main -> production project.
# Needs repository secrets (Settings -> Secrets and variables -> Actions): SUPABASE_ACCESS_TOKEN,
# SUPABASE_PRELIVE_PROJECT_REF + SUPABASE_PRELIVE_DB_PASSWORD, SUPABASE_PROJECT_REF + SUPABASE_DB_PASSWORD.
# Until they exist the job explains itself and exits green. See PRELIVE.md.
name: Deploy Supabase
on:
  push:
    branches: [prelive, main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PRELIVE_PROJECT_REF }}
      DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_PASSWORD || secrets.SUPABASE_PRELIVE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "Supabase secrets for '${{ github.ref_name }}' are not set yet - see PRELIVE.md. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.gate.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
      - name: Push migrations
        if: steps.gate.outputs.ready == 'true'
        run: supabase db push --password "$DB_PASSWORD"
      - name: Deploy edge functions
        if: steps.gate.outputs.ready == 'true' && hashFiles('supabase/functions/**') != ''
        run: supabase functions deploy --project-ref "$PROJECT_REF"
